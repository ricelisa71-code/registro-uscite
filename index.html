<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richiesta Libera Uscita</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; --border: #334155; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .form-card { background: var(--card); padding: 25px; border-radius: 15px; width: 100%; max-width: 450px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: var(--accent); margin-bottom: 20px; font-size: 1.5rem; }
        label { display: block; margin: 12px 0 5px; font-size: 0.9rem; color: #94a3b8; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: white; font-size: 1rem; box-sizing: border-box; outline: none; }
        input:focus, select:focus { border-color: var(--accent); }
        .options-container { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-top: 5px; }
        .section-title { font-weight: 800; color: var(--accent); font-size: 0.75rem; text-transform: uppercase; margin: 10px 0 5px; border-bottom: 1px solid #334155; padding-bottom: 3px; }
        .check-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; cursor: pointer; color: var(--text); font-size: 0.95rem; }
        .check-item input { width: 18px; height: 18px; accent-color: var(--accent); }
        .btn-submit { width: 100%; background: var(--accent); color: #0f172a; border: none; padding: 15px; border-radius: 8px; font-weight: 800; margin-top: 25px; cursor: pointer; transition: 0.2s; }
        .btn-submit:disabled { background: #475569; opacity: 0.7; }
        #status-msg { display: none; text-align: center; padding: 15px; border-radius: 8px; margin-top: 20px; font-weight: bold; }
        .msg-success { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid #22c55e; }
    </style>
</head>
<body>

<div class="form-card">
    <h2><i class="fas fa-paper-plane"></i> Invia Richiesta</h2>
    <form id="requestForm">
        <label>Data di riferimento</label>
        <input type="date" id="data" required>

        <label>Grado</label>
        <select id="grado" required>
            <option value="" disabled selected>Seleziona grado</option>
            <option value="CAM">CAM</option>
            <option value="ACAM">ACAM</option>
            <option value="VBAM">VBAM</option>
            <option value="ALTRO">ALTRO</option>
        </select>

        <label>Cognome e Nome</label>
        <input type="text" id="nominativo" placeholder="ROSSI MARIO" required oninput="this.value = this.value.toUpperCase()">

        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;"><label>Compagnia</label><input type="text" id="compagnia" placeholder="es. 1^" required></div>
            <div style="flex: 1;"><label>Plotone</label><input type="text" id="plotone" placeholder="es. 2°" required></div>
        </div>

        <label>Opzioni Weekend</label>
        <div class="options-container">
            <div class="section-title">Sabato</div>
            <label class="check-item"><input type="checkbox" name="op" value="SAB 1^ Fascia"> 1^ Fascia (17:30-23:00)</label>
            <label class="check-item"><input type="checkbox" name="op" value="SAB 2^ Fascia"> 2^ Fascia (Pomeridiana)</label>
            <label class="check-item"><input type="checkbox" name="op" value="SAB 3^ Fascia"> 3^ Fascia</label>
            <label class="check-item" data-type="pasto"><input type="checkbox" name="op" value="SAB Salto Pasto"> Salto Pasto</label>

            <div class="section-title">Domenica</div>
            <label class="check-item"><input type="checkbox" name="op" value="DOM 1^ Fascia"> 1^ Fascia</label>
            <label class="check-item"><input type="checkbox" name="op" value="DOM 2^ Fascia"> 2^ Fascia</label>
            <label class="check-item"><input type="checkbox" name="op" value="DOM 3^ Fascia"> 3^ Fascia</label>
            <label class="check-item" data-type="pasto"><input type="checkbox" name="op" value="DOM Salto Pasto"> Salto Pasto</label>
            
            <div class="section-title">Altro</div>
            <label class="check-item"><input type="checkbox" name="op" value="Pernotto"> Pernotto</label>
            <label class="check-item"><input type="checkbox" name="op" value="Fine Settimana"> Fine Settimana</label>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">INVIA AL COMANDO</button>
    </form>
    <div id="status-msg"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://database-libere-uscite-default-rtdb.firebaseio.com/" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const form = document.getElementById('requestForm');
    const msg = document.getElementById('status-msg');
    const btn = document.getElementById('submitBtn');

    form.onsubmit = async (e) => {
        e.preventDefault();
        const boxes = Array.from(document.querySelectorAll('input[name="op"]:checked'));
        if (boxes.length === 0) return alert("Seleziona almeno un'opzione!");

        btn.disabled = true;
        btn.innerText = "INVIO...";

        const pasti = boxes.filter(cb => cb.parentElement.dataset.type === "pasto").map(cb => cb.value);
        const uscite = boxes.filter(cb => cb.parentElement.dataset.type !== "pasto").map(cb => cb.value);

        const base = {
            data: document.getElementById('data').value,
            grado: document.getElementById('grado').value,
            nominativo: document.getElementById('nominativo').value.trim(),
            compagnia: document.getElementById('compagnia').value.trim(),
            plotone: document.getElementById('plotone').value.trim(),
            timestamp: Date.now()
        };

        try {
            if (uscite.length > 0) await push(ref(db, 'registrazioni'), { ...base, scelta: uscite.join(", "), stato: "A" });
            if (pasti.length > 0) await push(ref(db, 'registrazioni'), { ...base, scelta: pasti.join(", "), stato: "P" });

            msg.innerText = "Richiesta inviata correttamente!";
            msg.className = "msg-success";
            msg.style.display = "block";
            form.reset();
        } catch (err) {
            alert("Errore nell'invio: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "INVIA AL COMANDO";
            setTimeout(() => { msg.style.display = "none"; }, 4000);
        }
    };
</script>
</body>

</html>
